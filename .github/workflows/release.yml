# A release for every new version: when a push to main or Beta carries a version of the integration (manifest.json) that has no release
# yet, this makes it. A version with a "b" (0.2.0b5) is a pre-release, so HACS offers it only with "Show beta versions" on. The notes are
# the commit's message.
name: Release
on:
  push:
    branches: [main, Beta]
    paths: ["custom_components/cleanyourtv/manifest.json", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
# a push to main and Beta at once must not make the release twice
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release the version of manifest.json if it has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/cleanyourtv/manifest.json'))['version'])")
          tag="v$v"
          # releases of this tag made twice (two pushes at once, before the concurrency group): the oldest one stays
          dupes=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name==\"$tag\")] | sort_by(.id) | .[1:] | .[].id")
          for id in $dupes; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" && echo "removed duplicate release $id"; done
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag exists"; exit 0; fi
          pre=""
          case "$v" in *b*|*a*|*rc*) pre="--prerelease" ;; esac
          git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$v" --notes-file notes.md $pre
